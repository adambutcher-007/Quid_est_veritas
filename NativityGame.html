<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>The Nativity: Light of the World</title>
<!-- Build: M7 polish — v1.0 -->

<style>
  :root {
    --gold: #e8c56a;
    --deep: #10131f;
    --panel: rgba(16, 19, 31, 0.88);
    --text: #f2ecd9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--deep); font-family: Georgia, 'Times New Roman', serif; color: var(--text); }
  canvas#game { position: fixed; inset: 0; display: block; touch-action: none; }

  .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hidden { display: none !important; }

  /* ---- Title screen ---- */
  #title { background: radial-gradient(ellipse at 50% 35%, #2a3352 0%, var(--deep) 70%); z-index: 30; cursor: pointer; text-align: center; padding: 24px; }
  #title h1 { font-size: clamp(28px, 6vw, 54px); color: var(--gold); letter-spacing: 2px; text-shadow: 0 0 24px rgba(232,197,106,.45); }
  #title h2 { font-size: clamp(14px, 3vw, 22px); font-weight: normal; font-style: italic; margin-top: 10px; opacity: .85; }
  #title .verse { max-width: 560px; margin-top: 26px; font-style: italic; font-size: clamp(13px, 2.6vw, 17px); line-height: 1.5; opacity: .75; }
  #tapBegin { margin-top: 40px; padding: 16px 42px; font-size: clamp(16px, 3.4vw, 20px); font-family: inherit; color: var(--deep); background: var(--gold); border: none; border-radius: 999px; cursor: pointer; box-shadow: 0 0 30px rgba(232,197,106,.35); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  #titleStar { font-size: clamp(34px, 7vw, 60px); color: var(--gold); text-shadow: 0 0 30px var(--gold); margin-bottom: 12px; }

  /* ---- Loading / fallback ---- */
  #loadMsg { z-index: 40; background: var(--deep); font-size: 18px; text-align: center; padding: 24px; line-height: 1.6; }

  /* ---- Fade transition ---- */
  #fade { z-index: 25; background: #000; opacity: 0; pointer-events: none; transition: opacity .8s ease; }

  /* ---- HUD ---- */
  #hud { z-index: 10; pointer-events: none; }
  #menuBtn { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(232,197,106,.5); background: var(--panel); color: var(--gold); font-size: 22px; pointer-events: auto; cursor: pointer; }
  #interactBtn { position: fixed; bottom: calc(26px + env(safe-area-inset-bottom)); right: calc(26px + env(safe-area-inset-right)); width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(232,197,106,.18); color: var(--gold); font-family: inherit; font-size: 15px; pointer-events: auto; cursor: pointer; backdrop-filter: blur(2px); }
  #sceneLabel { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 14px; font-size: 14px; font-style: italic; opacity: .7; }
  #toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); max-width: 86vw; background: var(--panel); border: 1px solid rgba(232,197,106,.4); border-radius: 10px; padding: 12px 20px; font-size: 15px; text-align: center; opacity: 0; transition: opacity .4s; }
  #hint { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .5; white-space: nowrap; }

  /* ---- Virtual joystick ---- */
  #joyBase { position: fixed; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(242,236,217,.35); background: rgba(242,236,217,.08); z-index: 11; pointer-events: none; }
  #joyKnob { position: absolute; width: 52px; height: 52px; left: 34px; top: 34px; border-radius: 50%; background: rgba(232,197,106,.55); }

  /* ---- Pause menu ---- */
  #pause { z-index: 35; background: rgba(6,8,14,.82); backdrop-filter: blur(3px); }
  #pause .panel { background: var(--panel); border: 1px solid rgba(232,197,106,.4); border-radius: 14px; padding: 28px 30px; width: min(360px, 90vw); text-align: center; }
  #pause h3 { color: var(--gold); font-size: 22px; margin-bottom: 18px; }
  #pause label { display: block; text-align: left; font-size: 14px; margin: 14px 0 4px; opacity: .85; }
  #pause input[type=range] { width: 100%; accent-color: var(--gold); }
  .btnRow { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 11px 20px; font-family: inherit; font-size: 15px; border-radius: 8px; border: 1px solid rgba(232,197,106,.55); background: transparent; color: var(--text); cursor: pointer; }
  .btn.primary { background: var(--gold); color: var(--deep); border: none; }
  #pause .small { font-size: 12px; opacity: .55; margin-top: 16px; }

  /* ---- Dialogue ---- */
  #dialogue { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); width: min(680px, 94vw); background: var(--panel); border: 1px solid rgba(232,197,106,.45); border-radius: 14px; padding: 16px 18px; z-index: 20; cursor: pointer; }
  #dlgSpeaker { color: var(--gold); font-size: 15px; margin-bottom: 6px; letter-spacing: 1px; }
  #dlgText { font-size: 16px; line-height: 1.5; min-height: 48px; }
  #dlgChoices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  #dlgChoices button { text-align: left; padding: 11px 14px; font-family: inherit; font-size: 15px; color: var(--text); background: rgba(232,197,106,.1); border: 1px solid rgba(232,197,106,.4); border-radius: 8px; cursor: pointer; }
  #dlgChoices button:hover { background: rgba(232,197,106,.25); }
  #objective { position: fixed; top: calc(34px + env(safe-area-inset-top)); left: 14px; font-size: 13px; color: var(--gold); opacity: .9; max-width: 62vw; }
  #meters { position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 14px; font-size: 13px; color: var(--text); opacity: .85; background: rgba(16,19,31,.55); padding: 4px 10px; border-radius: 8px; }

  /* ---- Journal & scene completion ---- */
  #journal, #complete, #credits { z-index: 36; background: rgba(6,8,14,.85); backdrop-filter: blur(3px); }
  .bigPanel { background: var(--panel); border: 1px solid rgba(232,197,106,.4); border-radius: 14px; padding: 26px 28px; width: min(480px, 92vw); max-height: 80vh; overflow-y: auto; }
  .bigPanel h3 { color: var(--gold); margin-bottom: 14px; }
  .fragment { border-left: 3px solid var(--gold); padding: 8px 12px; margin: 10px 0; font-size: 14px; line-height: 1.5; background: rgba(232,197,106,.07); }
  .fragment b { color: var(--gold); }

  /* ---- M7 polish: touch targets & accessibility ---- */
  button { touch-action: manipulation; }
  .btn { min-height: 48px; }
  #dlgChoices button { min-height: 48px; padding: 13px 16px; }
  body.bigText #dlgText { font-size: 19px; }
  body.bigText #dlgSpeaker { font-size: 17px; }
  body.bigText #dlgChoices button { font-size: 17px; }
  body.bigText #toast { font-size: 17px; }
  body.bigText #objective { font-size: 15px; }
  body.bigText #meters { font-size: 15px; }
  body.reducedMotion #tapBegin { animation: none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Loading / CDN fallback -->
<div id="loadMsg" class="layer">Loading&hellip;</div>

<!-- Title -->
<div id="title" class="layer hidden">
  <div id="titleStar">&#10022;</div>
  <h1>The Nativity</h1>
  <h2>Light of the World</h2>
  <p class="verse">&ldquo;For there is born to you today, in David&rsquo;s city, a Savior, who is Christ the Lord.&rdquo; &mdash; Luke 2:11 (WEB)</p>
  <button id="tapBegin">Tap to Begin</button>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="sceneLabel"></div>
  <div id="objective"></div>
  <div id="meters" class="hidden"></div>
  <button id="menuBtn" aria-label="Menu">&#9776;</button>
  <button id="interactBtn" class="hidden">Interact</button>
  <div id="toast"></div>
  <div id="hint"></div>
</div>
<div id="joyBase" class="hidden"><div id="joyKnob"></div></div>

<!-- Pause menu -->
<div id="pause" class="layer hidden">
  <div class="panel">
    <h3>Paused</h3>
    <label>Music Volume</label>
    <input type="range" id="volMusic" min="0" max="100" value="70">
    <label>Sound Effects Volume</label>
    <input type="range" id="volSfx" min="0" max="100" value="80">
    <div class="btnRow">
      <button class="btn" id="textSizeBtn">Text Size: Normal</button>
      <button class="btn" id="motionBtn">Motion: Full</button>
    </div>
    <div class="btnRow">
      <button class="btn" id="sfxBell">&#128276; Bell</button>
      <button class="btn" id="sfxShimmer">&#10024; Shimmer</button>
      <button class="btn" id="sfxStep">&#128099; Step</button>
    </div>
    <div class="btnRow">
      <button class="btn" id="journalBtn">&#128214; Journal</button>
      <button class="btn primary" id="resumeBtn">Resume</button>
    </div>
    <p class="small">v1.0 &middot; The Nativity: Light of the World</p>
  </div>
</div>

<!-- Dialogue panel -->
<div id="dialogue" class="hidden">
  <div id="dlgSpeaker"></div>
  <div id="dlgText"></div>
  <div id="dlgChoices"></div>
</div>

<!-- Verse journal -->
<div id="journal" class="layer hidden">
  <div class="bigPanel">
    <h3>Verse Journal</h3>
    <div id="journalList"></div>
    <div class="btnRow"><button class="btn primary" id="journalClose">Close</button></div>
  </div>
</div>

<!-- Credits -->
<div id="credits" class="layer hidden">
  <div class="bigPanel" style="text-align:center">
    <h3>The Nativity: Light of the World</h3>
    <div id="creditsBody" style="line-height:1.7; font-size:14px"></div>
    <div class="btnRow">
      <button class="btn" id="creditsHallBtn">Prophecy Hall</button>
      <button class="btn" id="creditsExploreBtn">Explore Bethlehem</button>
      <button class="btn primary" id="creditsReplayBtn">Play Again</button>
    </div>
  </div>
</div>

<!-- Scene complete -->
<div id="complete" class="layer hidden">
  <div class="bigPanel" style="text-align:center">
    <h3 id="completeTitle"></h3>
    <p id="completeBody" style="line-height:1.6"></p>
    <div class="btnRow"><button class="btn primary" id="completeBtn">Continue</button></div>
  </div>
</div>

<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        onerror="document.getElementById('loadMsg').innerHTML='An internet connection is needed the first time the game loads.<br><br>Please connect and refresh the page.'"></script>

<script>
'use strict';
(function () {
  if (typeof THREE === 'undefined') return; // CDN fallback message already shown

  /* =====================================================
     AudioEngine — all sound synthesized with Web Audio API
  ===================================================== */
  const AudioEngine = {
    ctx: null, master: null, sfxBus: null, musicBus: null,

    unlock() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain();
      this.musicBus = this.ctx.createGain();
      this.sfxBus.connect(this.master);
      this.musicBus.connect(this.master);
      this.setSfxVolume(0.8);
      this.setMusicVolume(0.7);
    },
    setSfxVolume(v)   { if (this.sfxBus)   this.sfxBus.gain.value = v; },
    setMusicVolume(v) { if (this.musicBus) this.musicBus.gain.value = v; },
    suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
    resume()  { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

    _noiseBuffer(seconds) {
      const rate = this.ctx.sampleRate;
      const buf = this.ctx.createBuffer(1, rate * seconds, rate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    },

    /* SFX 1 — Footstep: short filtered noise burst */
    footstep() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this._noiseBuffer(0.12);
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(420 + Math.random() * 180, t);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      src.connect(filt).connect(g).connect(this.sfxBus);
      src.start(t); src.stop(t + 0.13);
    },

    /* SFX 2 — Soft bell: sine fundamental + decaying harmonics */
    bell(freq = 880) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [[1, 0.5, 1.6], [2.76, 0.18, 1.0], [5.4, 0.07, 0.6]].forEach(([mult, amp, dur]) => {
        const o = this.ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * mult;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(amp, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(this.sfxBus);
        o.start(t); o.stop(t + dur + 0.05);
      });
    },

    /* SFX 3 — Angel shimmer: rising detuned triad cluster */
    shimmer() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const base = 440;
      [1, 1.25, 1.5, 2, 2.5].forEach((ratio, i) => {
        const o = this.ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(base * ratio * 0.85, t);
        o.frequency.exponentialRampToValueAtTime(base * ratio, t + 1.4);
        const trem = this.ctx.createOscillator();
        trem.frequency.value = 5 + i * 1.3;
        const tremG = this.ctx.createGain();
        tremG.gain.value = 0.04;
        trem.connect(tremG);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.11, t + 0.6 + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, t + 2.6);
        tremG.connect(g.gain);
        o.connect(g).connect(this.sfxBus);
        o.start(t); o.stop(t + 2.7);
        trem.start(t); trem.stop(t + 2.7);
      });
    },

    /* Sustained pad chord on the music bus */
    pad(freqs, when = 0, dur = 1.4, vol = 0.06) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + when;
      freqs.forEach(f => {
        [0, 4].forEach(det => {
          const o = this.ctx.createOscillator();
          o.type = 'triangle';
          o.frequency.value = f;
          o.detune.value = det;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g).connect(this.musicBus);
          o.start(t); o.stop(t + dur + 0.05);
        });
      });
    },

    /* Magnificat cue — swelling D–G–A–D progression */
    magnificat() {
      if (!this.ctx) return;
      const D4 = 293.66, Fs4 = 369.99, A4 = 440, G3 = 196, B3 = 246.94,
            D5 = 587.33, A3 = 220, Cs4 = 277.18, E4 = 329.63;
      this.pad([D4, Fs4, A4], 0, 1.7);
      this.pad([G3, B3, D4], 1.5, 1.7);
      this.pad([A3, Cs4, E4], 3.0, 1.7);
      this.pad([D4, Fs4, A4, D5], 4.5, 3.4, 0.075);
      setTimeout(() => this.shimmer(), 4500);
    },

    /* Wood-planing scrape (Scene 2) */
    scrape() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this._noiseBuffer(0.3);
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(1400, t);
      filt.frequency.exponentialRampToValueAtTime(500, t + 0.28);
      filt.Q.value = 1.2;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.28, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      src.connect(filt).connect(g).connect(this.sfxBus);
      src.start(t); src.stop(t + 0.32);
    },

    /* Low pulsing danger drone (Scene 3) */
    drone(dur = 2.4) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = 55;
      const lfo = this.ctx.createOscillator();
      lfo.frequency.value = 3.2;
      const lg = this.ctx.createGain();
      lg.gain.value = 0.04;
      lfo.connect(lg);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.4);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      lg.connect(g.gain);
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 240;
      o.connect(filt).connect(g).connect(this.sfxBus);
      o.start(t); o.stop(t + dur + 0.05);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    },

    /* Soft baby coo (Scene 4) */
    coo() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(430, t);
      o.frequency.linearRampToValueAtTime(620, t + 0.25);
      o.frequency.linearRampToValueAtTime(480, t + 0.55);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g).connect(this.sfxBus);
      o.start(t); o.stop(t + 0.65);
    },

    /* Looping rain wash (Scene 3) */
    _rain: null,
    rainStart() {
      if (!this.ctx || this._rain) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this._noiseBuffer(2);
      src.loop = true;
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 850;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, this.ctx.currentTime + 1.5);
      src.connect(filt).connect(g).connect(this.sfxBus);
      src.start();
      this._rain = { src, g };
    },
    rainStop() {
      if (!this._rain) return;
      const { src, g } = this._rain;
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1);
      setTimeout(() => { try { src.stop(); } catch (e) {} }, 1200);
      this._rain = null;
    },

    /* Gloria — full angelic-host choir cue (Scene 5) */
    gloria() {
      if (!this.ctx) return;
      const G3 = 196, B3 = 246.94, D4 = 293.66, G4 = 392, Fs4 = 369.99,
            A4 = 440, E4 = 329.63, C4 = 261.63, B4 = 493.88, D5 = 587.33;
      this.pad([G3, B3, D4, G4], 0, 2.2, 0.08);
      this.pad([D4, Fs4, A4], 2.0, 2.2, 0.08);
      this.pad([E4, G4, B4], 4.0, 2.2, 0.08);
      this.pad([C4, E4, G4], 6.0, 2.4, 0.08);
      this.pad([G3, B3, D4, G4, D5], 8.2, 4.2, 0.09);
      this.shimmer();
      setTimeout(() => this.shimmer(), 3200);
      setTimeout(() => this.shimmer(), 6400);
    },

    /* Sheep bleat */
    bleat() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(580, t);
      o.frequency.linearRampToValueAtTime(500, t + 0.32);
      const vib = this.ctx.createOscillator();
      vib.frequency.value = 26;
      const vg = this.ctx.createGain();
      vg.gain.value = 34;
      vib.connect(vg).connect(o.frequency);
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 900;
      filt.Q.value = 1.4;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(filt).connect(g).connect(this.sfxBus);
      o.start(t); o.stop(t + 0.4);
      vib.start(t); vib.stop(t + 0.4);
    },

    /* Donkey hoof clop — two quick ticks */
    clop() {
      if (!this.ctx) return;
      [0, 0.11].forEach(off => {
        const t = this.ctx.currentTime + off;
        const src = this.ctx.createBufferSource();
        src.buffer = this._noiseBuffer(0.04);
        const filt = this.ctx.createBiquadFilter();
        filt.type = 'highpass';
        filt.frequency.value = 900;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        src.connect(filt).connect(g).connect(this.sfxBus);
        src.start(t); src.stop(t + 0.05);
      });
    },

    /* ---- Generative ambient music (looping chord pads) ---- */
    _musicTimer: null,
    _profiles: {
      nazareth: { bar: 3.6, vol: 0.032, chords: [
        [293.66, 369.99, 440], [196, 246.94, 293.66],
        [246.94, 293.66, 369.99], [220, 277.18, 329.63]
      ]},
      journey: { bar: 3.0, vol: 0.03, chords: [
        [293.66, 349.23, 440], [261.63, 329.63, 392],
        [233.08, 293.66, 349.23], [220, 277.18, 329.63]
      ]},
      lullaby: { bar: 4.4, vol: 0.034, chords: [
        [293.66, 369.99, 440], [196, 246.94, 293.66],

      ]},
      night: { bar: 4.0, vol: 0.028, chords: [
        [246.94, 293.66, 369.99], [196, 246.94, 293.66],
        [164.81, 196, 246.94], [185, 220, 277.18]
      ]}
    },
    startMusic(name) {
      this.stopMusic();
      const p = this._profiles[name];
      if (!p) return;
      let i = 0;
      const step = () => {
        if (!this.ctx || this.ctx.state !== 'running') return;
        this.pad(p.chords[i % p.chords.length], 0, p.bar * 1.25, p.vol);
        i++;
      };
      step();
      this._musicTimer = setInterval(step, p.bar * 1000);

    stopMusic() {

        clearInterval(this._musicTimer);
        this._musicTimer = null;

  /* =====================================================
     Input — keyboard (WASD/arrows) + touch joystick + look
  ===================================================== */
  const Input = {
    move: { x: 0, y: 0 },          // -1..1 movement vector
    look: { dx: 0, dy: 0 },        // per-frame look delta
    interactPressed: false,
    _keys: {},
    _joyTouch: null, _lookTouch: null,
    _joyOrigin: { x: 0, y: 0 },
    _mouseDown: false, _mouseLast: { x: 0, y: 0 },
    isTouchDevice: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,

    init(canvas) {
      // Keyboard
      window.addEventListener('keydown', e => {
        this._keys[e.code] = true;
        if (e.code === 'KeyE') this.interactPressed = true;
        if (e.code === 'Escape') Game.togglePause();
        if ((e.code === 'Enter' || e.code === 'Space') && Game.dialogueActive) {
          e.preventDefault();
          DialogueSystem.advanceKey();
        }
      });
      window.addEventListener('keyup', e => { this._keys[e.code] = false; });

      // Mouse look
      canvas.addEventListener('mousedown', e => { this._mouseDown = true; this._mouseLast = { x: e.clientX, y: e.clientY }; });
      window.addEventListener('mouseup', () => { this._mouseDown = false; });
      window.addEventListener('mousemove', e => {
        if (!this._mouseDown) return;
        this.look.dx += e.clientX - this._mouseLast.x;
        this.look.dy += e.clientY - this._mouseLast.y;
        this._mouseLast = { x: e.clientX, y: e.clientY };
      });

      // Touch: left half = joystick, right half = look
      canvas.addEventListener('touchstart', e => {
        for (const t of e.changedTouches) {
          if (t.clientX < window.innerWidth / 2 && this._joyTouch === null) {
            this._joyTouch = t.identifier;
            this._joyOrigin = { x: t.clientX, y: t.clientY };
            UI.showJoystick(t.clientX, t.clientY);
          } else if (this._lookTouch === null) {
            this._lookTouch = t.identifier;
            this._mouseLast = { x: t.clientX, y: t.clientY };
          }
        }
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
          if (t.identifier === this._joyTouch) {
            const dx = t.clientX - this._joyOrigin.x;
            const dy = t.clientY - this._joyOrigin.y;
            const max = 50;
            const len = Math.hypot(dx, dy) || 1;
            const cl = Math.min(len, max);
            this.move.x = (dx / len) * (cl / max);
            this.move.y = (dy / len) * (cl / max);
            UI.moveJoystickKnob(this.move.x * max, this.move.y * max);
          } else if (t.identifier === this._lookTouch) {
            this.look.dx += t.clientX - this._mouseLast.x;
            this.look.dy += t.clientY - this._mouseLast.y;
            this._mouseLast = { x: t.clientX, y: t.clientY };
          }
        }
        e.preventDefault();
      }, { passive: false });

      const endTouch = e => {
        for (const t of e.changedTouches) {
          if (t.identifier === this._joyTouch) {
            this._joyTouch = null;
            this.move.x = 0; this.move.y = 0;
            UI.hideJoystick();
          } else if (t.identifier === this._lookTouch) {
            this._lookTouch = null;
          }
        }
      };
      canvas.addEventListener('touchend', endTouch);
      canvas.addEventListener('touchcancel', endTouch);
    },

    update() {
      // Merge keyboard into move vector
      let kx = 0, ky = 0;
      if (this._keys['KeyW'] || this._keys['ArrowUp'])    ky -= 1;
      if (this._keys['KeyS'] || this._keys['ArrowDown'])  ky += 1;
      if (this._keys['KeyA'] || this._keys['ArrowLeft'])  kx -= 1;
      if (this._keys['KeyD'] || this._keys['ArrowRight']) kx += 1;
      if (kx || ky) {
        const len = Math.hypot(kx, ky);
        this.move.x = kx / len;
        this.move.y = ky / len;
      } else if (this._joyTouch === null) {
        this.move.x = 0; this.move.y = 0;
      }
    },
    consumeLook() {
      const l = { dx: this.look.dx, dy: this.look.dy };
      this.look.dx = 0; this.look.dy = 0;
      return l;
    },
    consumeInteract() {
      const p = this.interactPressed;
      this.interactPressed = false;
      return p;
    }
  };

  /* =====================================================
     Controller — shared third-person movement + camera.
     W / joystick-up moves AWAY from the camera; S toward it.
  ===================================================== */
  const Controller = {
    camYaw: 0, camPitch: 0.35, _step: 0,
    reset(yaw = 0, pitch = 0.35) { this.camYaw = yaw; this.camPitch = pitch; this._step = 0; },
    update(p, dt, opt = {}) {
      const speed = opt.speed || 3.2;
      const dist = opt.camDist || 5.2;
      const height = opt.camHeight || 2.2;
      const look = Input.consumeLook();
      this.camYaw   -= look.dx * 0.005;
      this.camPitch = Math.min(opt.maxPitch || 1.2, Math.max(opt.minPitch || 0.08, this.camPitch + look.dy * 0.004));

      const mv = Input.move;
      const moving = !!(mv.x || mv.y);
      if (moving) {
        const ang = this.camYaw;
        // mv.y = -1 (W / joystick-up) => move along -(sin,cos) = away from camera
        const dx = mv.x * Math.cos(ang) + mv.y * Math.sin(ang);
        const dz = -mv.x * Math.sin(ang) + mv.y * Math.cos(ang);
        p.position.x += dx * speed * dt;
        p.position.z += dz * speed * dt;
        if (opt.clamp) opt.clamp(p.position);
        p.rotation.y = Math.atan2(dx, dz);
        this._step -= dt;
        if (this._step <= 0) { AudioEngine.footstep(); this._step = 0.34; }
        p.position.y = Game.reducedMotion ? 0 : Math.abs(Math.sin(performance.now() * 0.012)) * 0.04;
      } else {
        p.position.y = 0;
        this._step = 0;
      }
      Assets.animateWalk(p, moving, dt);

      // Follow camera
      const cx = p.position.x + Math.sin(this.camYaw) * Math.cos(this.camPitch) * dist;
      const cz = p.position.z + Math.cos(this.camYaw) * Math.cos(this.camPitch) * dist;
      const cy = p.position.y + height + Math.sin(this.camPitch) * dist * 0.8;
      Game.camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.12);
      Game.camera.lookAt(p.position.x, p.position.y + 1.1, p.position.z);
      return moving;
    }
  };

  /* =====================================================
     UI helpers
  ===================================================== */
  const UI = {
    el: id => document.getElementById(id),
    show(id) { this.el(id).classList.remove('hidden'); },
    hide(id) { this.el(id).classList.add('hidden'); },
    _toastTimer: null,

    toast(msg, ms = 3200) {
      const t = this.el('toast');
      t.innerHTML = msg;
      t.style.opacity = 1;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { t.style.opacity = 0; }, ms);
    },
    setSceneLabel(txt) { this.el('sceneLabel').textContent = txt; },
    setObjective(html) { this.el('objective').innerHTML = html; },
    setMeters(html) { this.el('meters').innerHTML = html; },
    setHint(txt) { this.el('hint').textContent = txt; },
    showJoystick(x, y) {
      const b = this.el('joyBase');
      b.classList.remove('hidden');
      b.style.left = (x - 60) + 'px';
      b.style.top = (y - 60) + 'px';
      this.moveJoystickKnob(0, 0);
    },
    moveJoystickKnob(dx, dy) {
      this.el('joyKnob').style.transform = `translate(${dx}px, ${dy}px)`;
    },
    hideJoystick() { this.el('joyBase').classList.add('hidden'); },

    }
  };

  /* =====================================================
     DialogueSystem — typewriter text, choices, blessings
     Node: { who, text, next?, choices?[{label, next, blessing?}],
             end?, blessing?, action? }
  ===================================================== */
  const DialogueSystem = {
    script: null, nodeId: null, onComplete: null,
    _typing: null, _full: '',

    start(script, startId, onComplete) {
      this.script = script;
      this.onComplete = onComplete || null;
      Game.dialogueActive = true;
      UI.hide('interactBtn');
      UI.show('dialogue');
      this.goto(startId);
    },

    goto(id) {
      const n = this.script[id];
      this.nodeId = id;
      if (!n) return this.end();
      if (n.action) n.action();
      if (n.blessing) Game.addBlessing();
      UI.el('dlgSpeaker').textContent = n.who || '';
      UI.el('dlgChoices').innerHTML = '';
      const txt = UI.el('dlgText');
      this._full = n.text;
      txt.textContent = '';
      let i = 0;
      clearInterval(this._typing);
      this._typing = setInterval(() => {
        i += 2;
        txt.textContent = this._full.slice(0, i);
        if (i >= this._full.length) {
          clearInterval(this._typing);
          this._showOptions(n);
        }
      }, 24);
    },

    skip() {
      if (this._typing) {
        clearInterval(this._typing);
        UI.el('dlgText').textContent = this._full;
        this._showOptions(this.script[this.nodeId]);
      }
    },

    /* Enter/Space: finish typing, or press a sole Continue button */
    advanceKey() {
      if (this._typing) { this.skip(); return; }
      const box = UI.el('dlgChoices');
      if (box.children.length === 1) box.children[0].click();
    },

    _showOptions(n) {
      this._typing = null;
      const box = UI.el('dlgChoices');
      box.innerHTML = '';
      if (n.choices) {
        n.choices.forEach(c => {
          const b = document.createElement('button');
          b.textContent = c.label;
          b.onclick = e => {
            e.stopPropagation();
            AudioEngine.bell(990);
            if (c.blessing) Game.addBlessing();
            this.goto(c.next);
          };
          box.appendChild(b);
        });
      } else {
        const b = document.createElement('button');
        b.textContent = n.end ? '✦ Finish' : 'Continue ▸';
        b.onclick = e => {
          e.stopPropagation();
          if (n.end) this.end(); else this.goto(n.next);
        };
        box.appendChild(b);
      }
    },

    end() {
      clearInterval(this._typing);
      this._typing = null;
      UI.hide('dialogue');
      Game.dialogueActive = false;
      if (this.onComplete) {
        const f = this.onComplete;
        this.onComplete = null;
        f();
      }
    }
  };

    dust(count = 60, spread = 30, color = 0xfff4d6) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = [];
      for (let i = 0; i < count; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * spread;
        pos[i * 3 + 1] = Math.random() * 4 + 0.3;
        pos[i * 3 + 2] = (Math.random() - 0.5) * spread;
        vel.push({ x: (Math.random() - 0.5) * 0.15, y: (Math.random() - 0.5) * 0.05, z: (Math.random() - 0.5) * 0.15 });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({
        color, size: 0.07, transparent: true, opacity: 0.55, sizeAttenuation: true
      }));
      pts.userData = { vel, spread };
      return pts;
    },

    updateDust(pts, dt) {
      const pos = pts.geometry.attributes.position;
      const { vel, spread } = pts.userData;
      for (let i = 0; i < vel.length; i++) {
        let x = pos.getX(i) + vel[i].x * dt;
        let y = pos.getY(i) + vel[i].y * dt;
        let z = pos.getZ(i) + vel[i].z * dt;
        if (Math.abs(x) > spread / 2) x = -x * 0.95;
        if (y < 0.2 || y > 4.5) vel[i].y = -vel[i].y;
        if (Math.abs(z) > spread / 2) z = -z * 0.95;
        pos.setXYZ(i, x, y, z);
      }
      pos.needsUpdate = true;
    },

      x.fillStyle = '#a3915f';
      x.fillRect(0, 0, 128, 128);
      for (let i = 0; i < 900; i++) {
        x.fillStyle = `rgba(${120 + Math.random() * 60 | 0},${100 + Math.random() * 50 | 0},${60 + Math.random() * 40 | 0},0.5)`;
        x.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(24, 24);
      return tex;

          pos.z = Math.max(-38, Math.min(38, pos.z));
        }
      });

      // Ambient animation: star pulse + drifting dust
      this.time += dt;
      if (this.star) {

    update(dt) {
      this.time += dt;
      if (this.lampLight)
        this.lampLight.intensity = 0.8 + Math.sin(this.time * 11) * 0.12 + Math.random() * 0.06;
      if (this.scroll && !this.scroll.userData.taken)
        this.scroll.rotation.y += dt * 1.2;
      if (this.divineLight) {
        const target = this.phase === 'glory' ? 2.8 : 1.2;
        this.divineLight.intensity += (target - this.divineLight.intensity) * dt * 1.5;
      }
      if (this.gabriel)
        this.gabriel.position.y = 0.06 + Math.sin(this.time * 1.6) * 0.05;

      if (Game.dialogueActive) return;

      Controller.update(this.player, dt, {
        speed: 2.4, camDist: 3.8, camHeight: 1.7, maxPitch: 0.75,
        clamp: pos => {
          pos.x = Math.max(-2.9, Math.min(2.9, pos.x));
          pos.z = Math.max(-2.9, Math.min(2.9, pos.z));
        }
      });

      // Interactions
      let near = null;
      for (const it of this.interactables) {
        if (it.used) continue;
        if (this.player.position.distanceTo(it.obj.position) < it.r) { near = it; break; }
      }
      if (near !== this.nearest) {
        this.nearest = near;
        if (near) UI.show('interactBtn'); else UI.hide('interactBtn');
      }
      if (Input.consumeInteract() && near) {
        near.used = true;
        this.nearest = null;
        UI.hide('interactBtn');
        if (near.fragment) {
          this.scroll.userData.taken = true;
          Game.scene.remove(this.scroll);
          Game.addFragment('Isaiah 7:14',
            '&ldquo;Therefore the Lord himself will give you a sign. Behold, the virgin will conceive, and bear a son, and shall call his name Immanuel.&rdquo; (WEB)');
        } else {
          AudioEngine.bell(760);
          UI.toast(near.msg, 3400);
        }
        this.explored++;
        if (this.phase === 'explore' && this.explored >= 2) {
          this.phase = 'cue';
          UI.setObjective('');
          setTimeout(() => this.triggerAngel(), 1400);
        }
      }
    },

    dispose() {}
  };

            {
              label: 'Share your water',

              next: 't2',

    jackalHit() {
      this.jackalHits++;
      AudioEngine.footstep();
      this.jackals.forEach(j => { j.position.z -= 0.7; });
      if (this.jackalHits >= 3) {
        this.blocked = false;
        this.fleeing = true;
        this.fleeTime = 0;

        UI.setObjective('&#10022; Follow the road south to Bethlehem');

    ev_checkpoint() {

        s2: {

          end: true,

          }
        }
      }, 's1');

    ev_mary() {
      DialogueSystem.start({
        m1: {
          who: 'Mary',

      }, 'm1');
    },

    ev_gate() {
      DialogueSystem.start({
        i1: {
          who: 'Innkeeper',
          text: '“No room! Every bed in Bethlehem is taken for the census.”',
          choices: [
            { label: '“Please — my wife is with child.”', next: 'i2' },

          ]
        },
        i2: { who: 'Innkeeper', text: '“…There is a stable, out back among the animals. Warm straw, at least. It is all I have.”', next: 'i3' },
        i2b: { who: 'Innkeeper', text: '“It is not silver we lack, but room. …There is a stable, if you will have it.”', next: 'i3' },
        i3: { who: 'Narrator', text: 'And so it was that while they were there, the day had come for her to give birth. (Luke 2:6)', end: true }
      }, 'i1', () => {
        Game.showComplete(
          'Scene 3 Complete &mdash; The Journey to Bethlehem',
          'Through weariness and rain, God led them to David&rsquo;s city.<br><br>' +
          'Blessings of faith: <b>' + Game.blessing + '</b><br>' +
          'Scripture fragments: <b>' + Game.fragments.length + '</b>',
          'scene4'
        );
      });
    },

    update(dt) {
      this.time += dt;

      // Day → dusk → night sky as the road progresses
      const prog = Math.min(1, Math.max(0, (6 - this.player.position.z) / 126));
      const day = new THREE.Color(0x87a5c4), dusk = new THREE.Color(0xc98d5e), night = new THREE.Color(0x232c47);
      const c = prog < 0.5 ? day.clone().lerp(dusk, prog * 2) : dusk.clone().lerp(night, (prog - 0.5) * 2);
      if (this.raining) c.multiplyScalar(0.8);
      Game.scene.background = c;
      if (Game.scene.fog) Game.scene.fog.color.copy(c);

      // Rain falls around the caravan
      if (this.raining) {
        this.rainPts.position.x = this.player.position.x;
        this.rainPts.position.z = this.player.position.z;
        const pos = this.rainPts.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          let y = pos.getY(i) - dt * 13;
          if (y < 0) y = 7 + Math.random() * 2;
          pos.setY(i, y);
        }
        pos.needsUpdate = true;
      }

      // Fleeing jackals
      if (this.fleeing) {
        this.fleeTime += dt;
        this.jackals.forEach((j, i) => { j.position.x += dt * 6 * (i ? 1 : -1); });
        if (this.fleeTime > 1.6) {
          this.fleeing = false;
          this.jackals.forEach(j => j.visible = false);
        }
      }

      // Donkey (with Mary) follows Joseph
      const dir = new THREE.Vector3(Math.sin(this.player.rotation.y), 0, Math.cos(this.player.rotation.y));
      const target = this.player.position.clone().addScaledVector(dir, -1.5);
      target.x += 0.5;
      this.donkeyG.position.lerp(target, Math.min(1, dt * 2.2));
      this.donkeyG.rotation.y += (this.player.rotation.y - this.donkeyG.rotation.y) * Math.min(1, dt * 2.5);

      if (Game.dialogueActive) return;

      const lowSupplies = this.food <= 0 || this.water <= 0;
      const moving = Controller.update(this.player, dt, {
        speed: lowSupplies ? 2.0 : 3.2, camDist: 5.6, camHeight: 2.4,
        clamp: pos => {
          pos.x = Math.max(-8, Math.min(8, pos.x));
          pos.z = Math.max(-119.5, Math.min(8, pos.z));
          if (this.blocked) pos.z = Math.max(-36, pos.z);
        }
      });

      // Supplies deplete on the move
      if (moving) {
        this.food = Math.max(0, this.food - dt * 1.1);
        this.water = Math.max(0, this.water - dt * 1.5);
        this.clopT -= dt;
        if (this.clopT <= 0) { AudioEngine.clop(); this.clopT = 0.46; }
      }
      UI.setMeters('Food ' + Math.round(this.food) + ' &middot; Water ' + Math.round(this.water) +
        (lowSupplies ? ' &mdash; <em>weary&hellip;</em>' : ''));

      // Distance events
      for (const ev of this.events) {
        if (!ev.done && this.player.position.z < ev.z) {
          ev.done = true;
          this['ev_' + ev.id]();
          return;
        }
      }

      // Interactions (jackal standoff overrides proximity)
      let near = null;
      if (this.blocked) near = 'jackals';
      else {
        for (const it of this.interactables) {
          if (it.used) continue;
          if (this.player.position.distanceTo(it.obj.position) < it.r) { near = it.id; break; }
        }
      }
      if (near !== this.nearest) {
        this.nearest = near;
        if (near) UI.show('interactBtn'); else UI.hide('interactBtn');
      }
      if (Input.consumeInteract() && near) {
        if (near === 'jackals') this.jackalHit();
        else if (near === 'well') {
          this.water = 100;
          this.food = Math.min(100, this.food + 40);
          AudioEngine.bell(660);
          UI.toast('You refill the waterskins and share bread beside the well.', 3000);
        } else if (near === 'scroll') {
          this.interactables = this.interactables.filter(it => it.id !== 'scroll');
          Game.scene.remove(this.scrollProp);
          this.nearest = null;
          UI.hide('interactBtn');
          Game.addFragment('Micah 5:2',
            '&ldquo;But you, Bethlehem Ephrathah, being small among the clans of Judah, out of you one will come out to me that is to be ruler in Israel; whose goings out are from of old, from ancient times.&rdquo; (WEB)');
        }
      }
    },

    dispose() {
      AudioEngine.rainStop();
      UI.hide('meters');
    }
  };

      this.lanternG = new THREE.Group();

      mary.position.set(-0.8, 0, -4.2);
      mary.rotation.y = 2.6;

      } else {
        UI.setObjective('');
        UI.hide('interactBtn');
        this.nearest = null;
        this.phase = 'worship';
        setTimeout(() => this.worshipDialogue(), 700);
      }

    worshipDialogue() {
      DialogueSystem.start({
        c1: { who: 'Mary', text: '“His name is Jesus.”', next: 'c2' },
        c2: { who: 'Joseph', text: '“For it is he who shall save his people from their sins.”', next: 'c3' },
        c3: {
          who: 'Narrator',
          text: 'A holy peace descends upon the stable. The animals still. The star burns bright above.',
          choices: [
            { label: 'Kneel, and worship the newborn King', blessing: true, next: 'c4' }
          ]
        },
        c4: {
          who: 'Narrator',
          text: 'Glory to God in the highest. The Savior of the world sleeps in a manger.',
          end: true,
          action: () => { this.phase = 'glory'; AudioEngine.magnificat(); }
        }
      }, 'c1', () => {

          'Scene 4 Complete &mdash; The Birth in the Manger',
          'Unto you is born a Savior, who is Christ the Lord.<br><br>' +
          'Blessings of faith: <b>' + Game.blessing + '</b><br>' +
          'Scripture fragments: <b>' + Game.fragments.length + '</b>',

        );

    update(dt) {
      this.time += dt;
      if (this.star) {
        const pulse = 1 + Math.sin(this.time * 2.2) * 0.12;
        this.star.scale.setScalar(pulse);
        this.star.userData.light.intensity = 0.55 + Math.sin(this.time * 2.2) * 0.2;
        this.star.rotation.y += dt * 0.4;
      }
      if (this.lanternLit)
        this.lanternLight.intensity = 0.8 + Math.sin(this.time * 11) * 0.12 + Math.random() * 0.06;
      if (this.holyLight) {
        const targetI = this.phase === 'glory' ? 2.4 : 0.5;
        this.holyLight.intensity += (targetI - this.holyLight.intensity) * dt * 1.4;
      }
      this.animals.forEach(a => {
        if (a.sent && a.obj.position.distanceTo(a.target) > 0.1) {
          a.obj.position.lerp(a.target, Math.min(1, dt * 1.2));
        }
      });

      if (Game.dialogueActive) return;

      Controller.update(this.player, dt, {
        speed: 2.8, camDist: 4.8, camHeight: 2.1,
        clamp: pos => {
          pos.x = Math.max(-12, Math.min(12, pos.x));
          pos.z = Math.max(-12, Math.min(8, pos.z));
        }
      });

      // Phase-driven interactions
      let near = null;
      if (this.phase === 'prepare') {
        for (const h of this.hayPiles) {
          if (!h.used && this.player.position.distanceTo(h.obj.position) < 1.5) { near = h; break; }
        }
        if (!near) {
          for (const a of this.animals) {
            if (!a.sent && this.player.position.distanceTo(a.obj.position) < 1.9) { near = a; break; }
          }
        }
        if (!near && !this.lanternLit && this.player.position.distanceTo(this.lanternG.position) < 1.7)
          near = 'lantern';

        if (this.player.position.distanceTo(new THREE.Vector3(0, 0, -4.5)) < 2.2) near = 'baby';
      }

        this.nearest = near;
        if (near) UI.show('interactBtn'); else UI.hide('interactBtn');

      if (Input.consumeInteract() && near) {
        if (near === 'lantern') {

          this.flame.visible = true;
          AudioEngine.bell(840);
          UI.toast('The lantern glows warm against the night.', 2400);

          this.checkReady();

          UI.toast('The animal settles into its place.', 2000);
          this.refreshObjective();
          this.checkReady();

          near.obj.visible = false;

          this.refreshObjective();
          this.checkReady();
        }
        this.nearest = null;
        UI.hide('interactBtn');
      }
    },

    dispose() {}
  };

      this.phase = 'host';

        const a = Assets.person({ robe: 0xf7f2e2, head: 0xe9dcc0, sash: 0xe8c56a });
        const arc = -Math.PI * 0.4 + (i / 13) * Math.PI * 0.8;
        a.scale.setScalar(0.7 + Math.random() * 0.5);
        a.position.set(Math.sin(arc) * (9 + Math.random() * 5), 4 + Math.random() * 4, -8 - Math.cos(arc) * 6);
        a.rotation.y = Math.PI;
        a.traverse(o => {
          if (o.isMesh) { o.material = o.material.clone(); o.material.emissive = new THREE.Color(0x3a3010); }
        });
        Game.scene.add(a);
        this.host.push(a);
      }
      UI.toast('The sky fills with the armies of heaven!', 3000);
      setTimeout(() => {
        DialogueSystem.start({
          h1: { who: 'Multitude of Angels', text: '“Glory to God in the highest, on earth peace, good will toward men.” (Luke 2:14)', next: 'h2' },
          h2: {
            who: 'Eli the Shepherd',
            text: '“Did you see it? The glory of the Lord, round about us!”',
            choices: [
              { label: '“Let’s go to Bethlehem now, and see this thing that has happened!”', blessing: true, next: 'h3' },
              { label: '“I am afraid… can it be true?”', next: 'h2b' }
            ]
          },
          h2b: { who: 'Boaz the Shepherd', text: '“The angel said, ‘Don’t be afraid.’ Come — we will go together.”', next: 'h3' },
          h3: { who: 'Narrator', text: 'They left their flocks and came with haste toward David’s city. (Luke 2:16)', end: true }
        }, 'h1', () => {
          Game.showComplete(
            'Scene 5 Complete &mdash; Angels and Shepherds',
            'Good news of great joy, announced first to the lowly.<br><br>' +
            'Blessings of faith: <b>' + Game.blessing + '</b><br>' +
            'Scripture fragments: <b>' + Game.fragments.length + '</b>',
            'scene6'
          );
        });
      }, 2600);
    },

    update(dt) {
      this.time += dt;
      if (this.fire) {
        this.fire.userData.light.intensity = 1.0 + Math.sin(this.time * 12) * 0.2 + Math.random() * 0.1;
        this.fire.userData.flames.forEach((f, i) => {
          f.scale.y = 1 + Math.sin(this.time * (9 + i * 3)) * 0.18;
        });
      }
      this.bleatT -= dt;
      if (this.bleatT <= 0 && this.phase === 'herd') {
        AudioEngine.bleat();
        this.bleatT = 4 + Math.random() * 5;
      }
      if (this.glowLight && this.glowLight.intensity < 2.4)
        this.glowLight.intensity += dt * 0.9;
      if (this.mainAngel)
        this.mainAngel.position.y = 3.2 + Math.sin(this.time * 1.4) * 0.15;
      this.host.forEach((a, i) => {
        a.position.y += Math.sin(this.time * 1.2 + i) * dt * 0.25;
      });
      if (this.scrollProp && !this.scrollProp.userData.taken)
        this.scrollProp.rotation.y += dt * 1.2;
      this.strays.forEach(st => {
        if (st.sent && st.obj.position.distanceTo(st.target) > 0.15)
          st.obj.position.lerp(st.target, Math.min(1, dt * 1.1));
      });

      if (Game.dialogueActive) return;

      Controller.update(this.player, dt, {
        speed: 3.0, camDist: 5.2, camHeight: 2.2,
        clamp: pos => {
          pos.x = Math.max(-16, Math.min(16, pos.x));
          pos.z = Math.max(-16, Math.min(16, pos.z));
        }
      });

      let near = null;
      if (this.phase === 'herd') {
        for (const st of this.strays) {
          if (!st.sent && this.player.position.distanceTo(st.obj.position) < 1.7) { near = st; break; }
        }
      }
      if (!near && this.scrollProp && !this.scrollProp.userData.taken &&
          this.player.position.distanceTo(this.scrollProp.position) < 1.7) near = 'scroll';

      if (near !== this.nearest) {
        this.nearest = near;
        if (near) UI.show('interactBtn'); else UI.hide('interactBtn');
      }
      if (Input.consumeInteract() && near) {
        if (near === 'scroll') {
          this.scrollProp.userData.taken = true;
          Game.scene.remove(this.scrollProp);
          this.scrollProp = null;
          Game.addFragment('Isaiah 9:6',
            '&ldquo;For to us a child is born. To us a son is given; and the government will be on his shoulders. His name will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.&rdquo; (WEB)');
        } else {
          near.sent = true;
          this.strayDone++;
          AudioEngine.bell(640 + this.strayDone * 60);
          UI.toast('The stray trots home to the flock. (' + this.strayDone + '/3)', 2200);
          if (this.strayDone >= 3) {
            setTimeout(() => this.angelEvent(), 1200);
          } else {
            UI.setObjective('&#10022; Guide the strays back to the flock (' + this.strayDone + '/3)');
          }
        }
        this.nearest = null;
        UI.hide('interactBtn');
      }
    },

    dispose() {}
  };

      const pz = this.player.position.z;

      // The star leads on ahead, drifting with the road
      if (pz > -64) {
        this.star.position.x += ((Math.sin(pz * 0.05) * 3) - this.star.position.x) * dt;
        this.star.position.z = pz - 18;
      } else {
        this.star.position.x += (0 - this.star.position.x) * dt;
        this.star.position.z += (-70 - this.star.position.z) * dt;
      }
      const pulse = 1.4 + Math.sin(this.time * 2.2) * 0.15;
      this.star.scale.setScalar(pulse);
      this.star.userData.light.intensity = 0.7 + Math.sin(this.time * 2.2) * 0.25;

      // On-course chime
      this.chimeT += dt;
      const off = Math.abs(this.player.position.x - this.star.position.x) > 4.5;
      if (!off && this.chimeT > 4) { AudioEngine.bell(1320); this.chimeT = 0; }
      if (off && !this.offCourse) UI.toast('The star&rsquo;s light dims at the road&rsquo;s edge &mdash; steer beneath it.', 2600);
      this.offCourse = off;

      // Companions follow
      const ry = this.player.rotation.y;
      const dir = new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry));
      const perp = new THREE.Vector3(Math.cos(ry), 0, -Math.sin(ry));
      this.companions.forEach(c => {
        const target = this.player.position.clone().addScaledVector(dir, -1.6).addScaledVector(perp, c.side * 1.1);
        c.obj.position.lerp(target, Math.min(1, dt * 2.2));
        c.obj.rotation.y += (ry - c.obj.rotation.y) * Math.min(1, dt * 2.5);
      });

      if (Game.dialogueActive) return;

      Controller.update(this.player, dt, {
        speed: 3.2, camDist: 5.6, camHeight: 2.4,
        clamp: pos => {
          pos.x = Math.max(-10, Math.min(10, pos.x));
          pos.z = Math.max(-70, Math.min(7, pos.z));
        }
      });

      for (const ev of this.events) {
        if (!ev.done && pz < ev.z) {
          ev.done = true;
          this['ev_' + ev.id]();
          return;
        }
      }
    },

    dispose() {}
  };

      Game.scene.background = c;
      if (Game.scene.fog) Game.scene.fog.color.copy(c);

      // Patrols sweep across the road
      this.patrols.forEach(p => {
        p.obj.position.x = Math.sin(this.time * 0.5 + p.phase) * 5;
        p.obj.rotation.y = Math.cos(this.time * 0.5 + p.phase) > 0 ? Math.PI / 2 : -Math.PI / 2;

        }
      }
    },

      let near = null;
      for (const p of this.pedestals) {
        if (this.player.position.distanceTo(p.obj.position) < 1.8) { near = p; break; }
      }
      if (!near && this.player.position.distanceTo(this.exitArch.position) < 2.2) near = 'exit';

      if (near !== this.nearest) {
        this.nearest = near;
        if (near) UI.show('interactBtn'); else UI.hide('interactBtn');
      }
      if (Input.consumeInteract() && near) {
        this.nearest = null;
        UI.hide('interactBtn');
        if (near === 'exit') {
          UI.setObjective('');
          Game.showCredits();
        } else {
          AudioEngine.bell(near.collected ? 1180 : 440);
          this.pedestalDialogue(near);
        }
      }
    },

    dispose() {}
  };

  /* =====================================================
     Game — boot, loop, pause
  ===================================================== */
  const Game = {
    renderer: null, scene: null, camera: null, clock: null,
    running: false, paused: false, dialogueActive: false,
    blessing: 0, fragments: [],
    reducedMotion: false, bigText: false,
    _fpsAcc: 0, _fpsN: 0, _fpsLow: 0, _qualityStepped: false, _wasPortrait: false,

    addBlessing() {
      this.blessing++;
      UI.toast('&#10022; A blessing of faith received (' + this.blessing + ')', 2200);
    },

    addFragment(ref, text) {
      this.fragments.push({ ref, text });
      AudioEngine.bell(1180);
      UI.toast('Scripture fragment collected: <b>' + ref + '</b> &mdash; see the Journal in the menu', 3800);
    },

    showCredits() {
      this.dialogueActive = true;
      AudioEngine.startMusic('lullaby');
      document.getElementById('creditsBody').innerHTML =
        '<em>&ldquo;For there is born to you today, in David&rsquo;s city, a Savior, who is Christ the Lord.&rdquo;</em><br><br>' +
        'Blessings of faith gathered: <b>' + this.blessing + '</b><br>' +
        'Scripture fragments found: <b>' + this.fragments.length + ' / 5</b><br><br>' +
        (this.fragments.length < 5
          ? 'Some fragments remain undiscovered &mdash; play again and search every scene.<br><br>'
          : 'Every prophecy found &mdash; well done, good and faithful servant!<br><br>') +
        'Scripture quotations from the World English Bible (public domain).<br>' +
        'A Bible-story adventure in eight scenes &middot; Luke 1&ndash;2 &amp; Matthew 1&ndash;2.<br>' +
        'Built with Three.js and the Web Audio API in a single file.';
      UI.show('credits');
    },

    async resetState() {
      this.blessing = 0;
      this.fragments = [];
      this.nextScene = null;
      await SceneManager.goto('scene1');
    },

    nextScene: null,
    showComplete(title, html, next) {
      this.nextScene = next || 'test';
      this.dialogueActive = true;
      document.getElementById('completeTitle').innerHTML = title;
      document.getElementById('completeBody').innerHTML = html;
      UI.show('complete');
    },

    boot() {
      const canvas = document.getElementById('game');
      const isMobile = Input.isTouchDevice;

      this.renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
      this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      this.renderer.setSize(window.innerWidth, window.innerHeight);

      this.scene = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 120);
      this.clock = new THREE.Clock();

      Input.init(canvas);
      SceneManager.register('test', TestScene);
      SceneManager.register('scene1', Scene1);
      SceneManager.register('scene2', Scene2);
      SceneManager.register('scene3', Scene3);
      SceneManager.register('scene4', Scene4);
      SceneManager.register('scene5', Scene5);
      SceneManager.register('scene6', Scene6);
      SceneManager.register('scene7', Scene7);
      SceneManager.register('scene8', Scene8);
      SceneManager.register('epilogue', Epilogue);
      SceneManager.register('hall', Hall);

      window.addEventListener('resize', () => {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        // Suggest landscape when a touch device rotates to portrait
        const portrait = window.innerHeight > window.innerWidth;
        if (portrait && !this._wasPortrait && Input.isTouchDevice && this.running)
          UI.toast('Tip: rotate your device to landscape for the best view.', 3500);
        this._wasPortrait = portrait;
      });
      this._wasPortrait = window.innerHeight > window.innerWidth;

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { AudioEngine.suspend(); }
        else if (!this.paused) { AudioEngine.resume(); }
      });

      // iOS Safari can suspend audio unexpectedly — nudge it back on any gesture
      const kickAudio = () => { if (this.running && !this.paused) AudioEngine.resume(); };
      document.addEventListener('touchstart', kickAudio, { passive: true });
      document.addEventListener('mousedown', kickAudio);

      // No long-press context menu over the game canvas
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      // Honor the system reduced-motion preference
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        this.reducedMotion = true;
        document.body.classList.add('reducedMotion');
        document.getElementById('motionBtn').textContent = 'Motion: Reduced';
      }

      UI.hide('loadMsg');
      UI.show('title');
    },

    async start() {
      AudioEngine.unlock();       // must happen inside the user gesture (iOS)
      AudioEngine.bell(880);      // audible confirmation that audio is live
      UI.hide('title');
      UI.show('hud');
      // QA shortcut: open index.html#scene3 (etc.) to jump straight to a scene
      const hash = (location.hash || '').replace('#', '');
      await SceneManager.goto(SceneManager.scenes[hash] ? hash : 'scene1');
      this.running = true;
      this.loop();
    },

    loop() {
      requestAnimationFrame(() => this.loop());
      if (!this.running || this.paused) return;
      const dt = Math.min(this.clock.getDelta(), 0.05);
      Input.update();
      SceneManager.update(dt);
      const sc = SceneManager.current;
      if (this.glowLight && sc && sc.player) {
        this.glowLight.position.set(sc.player.position.x, sc.player.position.y + 1.9, sc.player.position.z);
        this.glowLight.intensity = Math.min(1.1, this.blessing * 0.09);
      }
      this.renderer.render(this.scene, this.camera);

      // Auto quality step-down: sustained low FPS → drop pixel ratio once
      if (!this._qualityStepped) {
        this._fpsAcc += dt;
        this._fpsN++;
        if (this._fpsAcc >= 2) {
          const fps = this._fpsN / this._fpsAcc;
          this._fpsAcc = 0;
          this._fpsN = 0;
          this._fpsLow = fps < 26 ? this._fpsLow + 1 : 0;
          if (this._fpsLow >= 2) {
            this._qualityStepped = true;
            this.renderer.setPixelRatio(1);
          }
        }
      }
    },

    togglePause() {
      if (!this.running) return;
      this.paused = !this.paused;
      if (this.paused) { UI.show('pause'); AudioEngine.suspend(); }
      else { UI.hide('pause'); AudioEngine.resume(); this.clock.getDelta(); }
    }
  };

  /* =====================================================
     Wire up UI events
  ===================================================== */
  document.getElementById('tapBegin').addEventListener('click', () => Game.start());
  document.getElementById('menuBtn').addEventListener('click', () => Game.togglePause());
  document.getElementById('resumeBtn').addEventListener('click', () => Game.togglePause());
  document.getElementById('interactBtn').addEventListener('click', () => { Input.interactPressed = true; });
  document.getElementById('volMusic').addEventListener('input', e => AudioEngine.setMusicVolume(e.target.value / 100));
  document.getElementById('volSfx').addEventListener('input', e => AudioEngine.setSfxVolume(e.target.value / 100));
  document.getElementById('textSizeBtn').addEventListener('click', e => {
    Game.bigText = !Game.bigText;
    document.body.classList.toggle('bigText', Game.bigText);
    e.target.textContent = 'Text Size: ' + (Game.bigText ? 'Large' : 'Normal');
  });
  document.getElementById('motionBtn').addEventListener('click', e => {
    Game.reducedMotion = !Game.reducedMotion;
    document.body.classList.toggle('reducedMotion', Game.reducedMotion);
    e.target.textContent = 'Motion: ' + (Game.reducedMotion ? 'Reduced' : 'Full');
  });
  // SFX test buttons (resume audio briefly while paused so tests are audible)
  const testSfx = fn => { AudioEngine.resume(); fn(); setTimeout(() => { if (Game.paused) AudioEngine.suspend(); }, 3000); };
  document.getElementById('sfxBell').addEventListener('click', () => testSfx(() => AudioEngine.bell()));
  document.getElementById('sfxShimmer').addEventListener('click', () => testSfx(() => AudioEngine.shimmer()));
  document.getElementById('sfxStep').addEventListener('click', () => testSfx(() => AudioEngine.footstep()));

  // Dialogue: tap panel to complete the typewriter text
  document.getElementById('dialogue').addEventListener('click', () => DialogueSystem.skip());

  // Verse journal
  document.getElementById('journalBtn').addEventListener('click', () => {
    const list = document.getElementById('journalList');
    list.innerHTML = Game.fragments.length
      ? Game.fragments.map(f => '<div class="fragment"><b>' + f.ref + '</b><br>' + f.text + '</div>').join('')
      : '<p style="opacity:.7">No Scripture fragments collected yet. Look for glowing scrolls.</p>';
    UI.show('journal');
  });
  document.getElementById('journalClose').addEventListener('click', () => UI.hide('journal'));

  // Scene completion → next scene in the story
  document.getElementById('completeBtn').addEventListener('click', async () => {
    UI.hide('complete');
    Game.dialogueActive = false;
    await SceneManager.goto(Game.nextScene || 'test');
  });

  // Credits buttons
  document.getElementById('creditsReplayBtn').addEventListener('click', async () => {
    UI.hide('credits');
    Game.dialogueActive = false;
    await Game.resetState();
  });
  document.getElementById('creditsExploreBtn').addEventListener('click', async () => {
    UI.hide('credits');
    Game.dialogueActive = false;
    await SceneManager.goto('test');
    UI.toast('Bethlehem&rsquo;s outskirts &mdash; wander freely. Open the menu to replay from the credits any time.', 4600);
  });
  document.getElementById('creditsHallBtn').addEventListener('click', async () => {
    UI.hide('credits');
    Game.dialogueActive = false;
    await SceneManager.goto('hall');
  });

  Game.boot();
})();
</script>
</body>
</html>
