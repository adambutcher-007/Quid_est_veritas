<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quid est veritas? &mdash; A Treasury of Truths</title>
<style>
  :root{
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:var(--sans);
    color:#f3ecdf;
    background:#070a16;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    cursor:default;
  }

  /* ---------- Background ---------- */
  .bg{
    position:fixed; inset:-10%;
    background:
      radial-gradient(120% 120% at 22% 18%, #20335e 0%, transparent 58%),
      radial-gradient(120% 120% at 80% 26%, #3c2a64 0%, transparent 58%),
      radial-gradient(150% 150% at 50% 108%, #0e4045 0%, transparent 60%),
      linear-gradient(160deg, #0a1024 0%, #150f2c 50%, #081a1e 100%);
    animation: drift 60s ease-in-out infinite alternate;
    will-change: transform, filter;
  }
  @keyframes drift{
    0%   { transform: scale(1) translate(0,0);        filter: hue-rotate(0deg)   saturate(1); }
    100% { transform: scale(1.1) translate(-2.5%,-2%); filter: hue-rotate(28deg) saturate(1.15); }
  }

  /* page-wide colour sweep that builds toward the reveal */
  .sweep{
    position:fixed; inset:0; opacity:0; pointer-events:none;
    background:linear-gradient(125deg,#6a3bd0 0%,#2bbfd0 45%,#f1c673 100%);
    background-size:240% 240%;
    mix-blend-mode:screen;
    transition:opacity 1.2s ease;
  }
  .state-revealing .sweep{ opacity:.6; animation: sweepmove 2.8s ease-in-out forwards; }
  .state-revealed  .sweep{ opacity:.12; transition:opacity 2s ease; }
  @keyframes sweepmove{
    0%{ background-position:0% 50%;  filter:hue-rotate(0deg)   brightness(.9); }
   100%{ background-position:100% 50%; filter:hue-rotate(55deg) brightness(1.25); }
  }

  /* rotating light rays */
  .rays{
    position:fixed; left:50%; top:50%; width:200vmax; height:200vmax;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,
      rgba(255,250,235,.06) 0deg 1.4deg, transparent 1.4deg 9deg);
    opacity:0; pointer-events:none;
    animation: spin 150s linear infinite;
    transition:opacity 2s ease;
    -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 62%);
            mask-image:radial-gradient(circle, #000 0%, transparent 62%);
  }
  .state-revealing .rays,.state-revealed .rays{ opacity:.55; }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

  /* central radiant glow (the "opening" bloom) */
  .glow{
    position:fixed; left:50%; top:50%;
    width:46vmax; height:46vmax; border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle,
      rgba(255,248,232,.95) 0%,
      rgba(255,216,150,.55) 30%,
      rgba(180,150,255,.18) 55%,
      transparent 72%);
    opacity:0; pointer-events:none;
    filter:blur(2px);
  }
  .state-revealing .glow{
    opacity:1; transform:translate(-50%,-50%) scale(1.45);
    transition: opacity .7s ease, transform 2.8s cubic-bezier(.18,.72,.2,1);
  }
  .state-revealed .glow{
    opacity:.22; transform:translate(-50%,-50%) scale(1.12);
    transition: opacity 1.8s ease, transform 1.8s ease;
  }

  /* floating motes */
  .motes{ position:fixed; inset:0; opacity:0; pointer-events:none; transition:opacity 1.8s ease; }
  .state-revealing .motes,.state-revealed .motes{ opacity:1; }
  .mote{
    position:absolute; bottom:-24px; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,250,235,.95), transparent 70%);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%  { transform:translateY(0) translateX(0);    opacity:0; }
    12% { opacity:.9; }
    100%{ transform:translateY(-112vh) translateX(var(--drift,0)); opacity:0; }
  }

  /* ---------- Stage / content ---------- */
  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:7vh 8vw;
  }

  .intro{ transition:opacity 1s ease; max-width:760px; }
  .state-revealing .intro,.state-revealed .intro{ opacity:0; pointer-events:none; }

  .title{
    font-family:var(--serif); font-weight:500; font-style:italic;
    font-size:clamp(2.4rem,7vw,4.6rem); letter-spacing:.02em;
    color:#f7efe0; text-shadow:0 2px 40px rgba(180,160,255,.35);
  }
  .subtitle{
    margin-top:.4rem; font-size:clamp(.85rem,2.4vw,1.1rem);
    letter-spacing:.42em; text-transform:uppercase; color:#b9b2cf; font-weight:300;
  }
  .scripture-ask{
    margin-top:1.4rem; font-family:var(--serif); font-style:italic;
    color:#8f9bbf; font-size:clamp(.85rem,2.4vw,1rem); opacity:.85;
  }

  .orb{
    margin-top:3.2rem;
    font-family:var(--serif); font-size:1.15rem; letter-spacing:.06em;
    color:#1c1530;
    padding:1.05rem 2.6rem; border:none; border-radius:999px;
    background:radial-gradient(circle at 35% 30%, #fff6e2, #f3cf87 60%, #e0ad5b);
    box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,
               0 8px 40px rgba(243,207,135,.45),
               0 0 70px rgba(243,207,135,.25);
    cursor:pointer;
    transition:transform .4s ease, box-shadow .5s ease;
    animation: breathe 5.5s ease-in-out infinite;
  }
  .orb:hover{ transform:scale(1.05);
    box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,
               0 10px 60px rgba(243,207,135,.6),
               0 0 110px rgba(243,207,135,.4); }
  .orb:active{ transform:scale(.97); }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 8px 40px rgba(243,207,135,.4),0 0 60px rgba(243,207,135,.2);}
    50%    { box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 10px 56px rgba(243,207,135,.6),0 0 100px rgba(243,207,135,.38);}
  }
  .hint{ margin-top:1.6rem; font-size:.8rem; letter-spacing:.28em;
    text-transform:uppercase; color:#7b87a8; font-weight:300; }

  /* ---------- Revealed truth ---------- */
  .truth{
    position:absolute; max-width:880px; width:100%;
    pointer-events:none;
  }
  .truth-num,.truth-text,.truth-ref{
    opacity:0; transform:translateY(16px);
    transition:opacity 1.1s ease, transform 1.1s ease;
  }
  .truth-num{
    font-size:.95rem; letter-spacing:.38em; text-transform:uppercase;
    color:#e7c987; font-weight:400; margin-bottom:1.6rem;
    text-shadow:0 0 22px rgba(231,201,135,.4);
  }
  .truth-text{
    font-family:var(--serif); font-weight:400;
    font-size:clamp(1.7rem,4.6vw,3.1rem); line-height:1.4;
    color:#f8f2e6; text-shadow:0 2px 44px rgba(120,140,255,.25);
  }
  .truth-ref{
    margin-top:1.9rem; font-family:var(--serif); font-style:italic;
    font-size:clamp(1rem,2.6vw,1.4rem); color:#bcc6e6;
    padding-left:18%;
  }
  .state-revealed .truth-num { opacity:.95; transform:none; transition-delay:.15s; }
  .state-revealed .truth-text{ opacity:1;   transform:none; transition-delay:.55s; }
  .state-revealed .truth-ref { opacity:.9;  transform:none; transition-delay:1.25s; }

  .again{
    pointer-events:auto;
    margin-top:3.4rem;
    opacity:0; transform:translateY(16px);
    font-family:var(--serif); font-size:1rem; letter-spacing:.05em;
    color:#ece4d4; background:transparent;
    padding:.85rem 2.1rem; border:1px solid rgba(236,228,212,.4); border-radius:999px;
    cursor:pointer;
    transition:opacity 1.1s ease, transform 1.1s ease, background .4s ease, border-color .4s ease;
  }
  .state-revealed .again{ opacity:.95; transform:none; transition-delay:2s; }
  .again:hover{ background:rgba(236,228,212,.1); border-color:rgba(236,228,212,.8); }

  /* footer / treasury count */
  .treasury{
    position:fixed; bottom:max(1.4rem, env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; font-size:.72rem; letter-spacing:.26em; text-transform:uppercase;
    color:#6b7593; font-weight:300; pointer-events:none;
    transition:opacity 1s ease;
  }

  /* sound toggle */
  .mute{
    position:fixed; top:max(1.2rem, env(safe-area-inset-top)); right:1.4rem;
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    color:#e9e1d2; font-size:1.05rem; cursor:pointer; z-index:5;
    backdrop-filter:blur(6px);
    transition:background .3s ease, opacity .3s ease, transform .3s ease;
  }
  .mute:hover{ background:rgba(255,255,255,.14); transform:scale(1.06); }
  .mute.off{ opacity:.5; }

  @media (max-width:560px){
    .truth-ref{ padding-left:0; }
    .subtitle{ letter-spacing:.3em; }
  }
  @media (prefers-reduced-motion: reduce){
    .bg{ animation:none; } .rays{ animation:none; } .orb{ animation:none; }
  }
</style>
</head>
<body>
  <div id="app" class="state-idle">
    <div class="bg"></div>
    <div class="sweep"></div>
    <div class="rays"></div>
    <div class="motes" id="motes"></div>
    <div class="glow"></div>

    <button id="mute" class="mute" title="Toggle sound" aria-label="Toggle sound">&#9834;</button>

    <main class="stage">
      <div class="intro">
        <h1 class="title">Quid est veritas?</h1>
        <p class="subtitle">What is truth?</p>
        <p class="scripture-ask">&ldquo;Pilate said to him, &lsquo;What is truth?&rsquo;&rdquo; &mdash; John 18:38</p>
        <button id="reveal" class="orb">Reveal a Truth</button>
        <p class="hint">A treasury of 300 truths awaits</p>
      </div>

      <div class="truth" id="truth">
        <div class="truth-num">Truth&nbsp;#<span id="num"></span></div>
        <p class="truth-text" id="text"></p>
        <p class="truth-ref" id="ref"></p>
        <button id="again" class="again">Reveal Another</button>
      </div>
    </main>

    <p class="treasury" id="treasury">A treasury of 300 truths</p>
  </div>

<script>
const TRUTHS = [{"n":1,"text":"God is sovereign over all creation and works all things according to His will.","ref":"Ephesians 1:11"},{"n":2,"text":"God created the heavens and the earth out of nothing.","ref":"Genesis 1:1"},{"n":3,"text":"God is holy and calls His people to be holy.","ref":"1 Peter 1:15-16"},{"n":4,"text":"God is love, and love comes from Him.","ref":"1 John 4:7-8"},{"n":5,"text":"God is merciful and gracious, slow to anger and abounding in steadfast love.","ref":"Exodus 34:6"},{"n":6,"text":"God is faithful; He keeps His covenant.","ref":"Deuteronomy 7:9"},{"n":7,"text":"God never lies and His word proves true.","ref":"Titus 1:2; Proverbs 30:5"},{"n":8,"text":"God is omniscient, knowing all things.","ref":"Psalm 139:1-4"},{"n":9,"text":"God is omnipotent; nothing is too hard for Him.","ref":"Jeremiah 32:17"},{"n":10,"text":"God is just and will judge the world in righteousness.","ref":"Psalm 96:13"},{"n":11,"text":"Jesus is the only way to the Father and salvation.","ref":"John 14:6"},{"n":12,"text":"Jesus is the way, the truth, and the life.","ref":"John 14:6"},{"n":13,"text":"Jesus is our High Priest who sympathizes with our weaknesses.","ref":"Hebrews 4:15"},{"n":14,"text":"Jesus is fully God and fully man.","ref":"John 1:1, 14; Colossians 2:9"},{"n":15,"text":"Jesus died for our sins and rose again for our justification.","ref":"1 Corinthians 15:3-4; Romans 4:25"},{"n":16,"text":"Jesus is the resurrection and the life.","ref":"John 11:25"},{"n":17,"text":"Jesus gives abundant life.","ref":"John 10:10"},{"n":18,"text":"Jesus is the Good Shepherd who lays down His life for the sheep.","ref":"John 10:11"},{"n":19,"text":"Jesus is the Lamb of God who takes away the sin of the world.","ref":"John 1:29"},{"n":20,"text":"Jesus intercedes for us at the right hand of God.","ref":"Romans 8:34; Hebrews 7:25"},{"n":21,"text":"The Holy Spirit convicts the world concerning sin, righteousness, and judgment.","ref":"John 16:8"},{"n":22,"text":"The Holy Spirit regenerates and renews us.","ref":"Titus 3:5"},{"n":23,"text":"The Holy Spirit indwells and seals believers.","ref":"Ephesians 1:13; 1 Corinthians 3:16"},{"n":24,"text":"The Holy Spirit helps us in our weakness and intercedes for us.","ref":"Romans 8:26"},{"n":25,"text":"The Holy Spirit produces fruit in believers: love, joy, peace, etc.","ref":"Galatians 5:22-23"},{"n":26,"text":"The Holy Spirit leads us into all truth.","ref":"John 16:13"},{"n":27,"text":"The Holy Spirit empowers believers for witness and service.","ref":"Acts 1:8"},{"n":28,"text":"Believers are baptized by one Spirit into one body.","ref":"1 Corinthians 12:13"},{"n":29,"text":"The Holy Spirit gives spiritual gifts for the common good.","ref":"1 Corinthians 12:4-7"},{"n":30,"text":"Do not grieve the Holy Spirit.","ref":"Ephesians 4:30"},{"n":31,"text":"All have sinned and fall short of the glory of God.","ref":"Romans 3:23"},{"n":32,"text":"The wages of sin is death, but the free gift of God is eternal life.","ref":"Romans 6:23"},{"n":33,"text":"Humans are created in the image of God.","ref":"Genesis 1:27"},{"n":34,"text":"The heart is deceitful above all things.","ref":"Jeremiah 17:9"},{"n":35,"text":"Apart from Christ, we are dead in trespasses and sins.","ref":"Ephesians 2:1"},{"n":36,"text":"No one is righteous on their own.","ref":"Romans 3:10"},{"n":37,"text":"Pride goes before destruction.","ref":"Proverbs 16:18"},{"n":38,"text":"Man does not live by bread alone but by every word from God.","ref":"Deuteronomy 8:3; Matthew 4:4"},{"n":39,"text":"We are fearfully and wonderfully made.","ref":"Psalm 139:14"},{"n":40,"text":"The fear of the Lord is the beginning of wisdom.","ref":"Proverbs 9:10"},{"n":41,"text":"Salvation is by grace through faith, not works.","ref":"Ephesians 2:8-9"},{"n":42,"text":"Salvation is found in no one else but Jesus.","ref":"Acts 4:12"},{"n":43,"text":"Whoever believes in Jesus shall not perish but have eternal life.","ref":"John 3:16"},{"n":44,"text":"Repent and believe the gospel for forgiveness.","ref":"Mark 1:15; Acts 2:38"},{"n":45,"text":"If we confess with our mouth and believe in our heart, we will be saved.","ref":"Romans 10:9"},{"n":46,"text":"God saved us according to His mercy, not our works.","ref":"Titus 3:5"},{"n":47,"text":"There is now no condemnation for those in Christ Jesus.","ref":"Romans 8:1"},{"n":48,"text":"We are justified by faith and have peace with God.","ref":"Romans 5:1"},{"n":49,"text":"Christ suffered once for sins, the righteous for the unrighteous.","ref":"1 Peter 3:18"},{"n":50,"text":"Salvation includes regeneration by the Holy Spirit.","ref":"John 3:5-8"},{"n":51,"text":"Love the Lord with all your heart, soul, and mind.","ref":"Matthew 22:37"},{"n":52,"text":"Love your neighbor as yourself.","ref":"Matthew 22:39"},{"n":53,"text":"Take up your cross and follow Jesus.","ref":"Luke 9:23"},{"n":54,"text":"Be transformed by the renewal of your mind.","ref":"Romans 12:2"},{"n":55,"text":"Pray without ceasing.","ref":"1 Thessalonians 5:17"},{"n":56,"text":"Rejoice always, give thanks in all circumstances.","ref":"1 Thessalonians 5:16, 18"},{"n":57,"text":"Walk by the Spirit and not gratify the desires of the flesh.","ref":"Galatians 5:16"},{"n":58,"text":"Do not be anxious; make requests known to God.","ref":"Philippians 4:6-7"},{"n":59,"text":"Cast all your anxieties on Him because He cares for you.","ref":"1 Peter 5:7"},{"n":60,"text":"Let your light shine before others.","ref":"Matthew 5:16"},{"n":61,"text":"God will never leave nor forsake you.","ref":"Deuteronomy 31:6; Hebrews 13:5"},{"n":62,"text":"All things work together for good for those who love God.","ref":"Romans 8:28"},{"n":63,"text":"God has plans for welfare and a future and hope.","ref":"Jeremiah 29:11"},{"n":64,"text":"If we confess our sins, He is faithful to forgive.","ref":"1 John 1:9"},{"n":65,"text":"God is able to keep you from stumbling.","ref":"Jude 24"},{"n":66,"text":"The Lord is my shepherd; I shall not want.","ref":"Psalm 23:1"},{"n":67,"text":"God gives strength to the weary.","ref":"Isaiah 40:29-31"},{"n":68,"text":"Perfect peace for those whose mind is stayed on Him.","ref":"Isaiah 26:3"},{"n":69,"text":"God supplies every need according to His riches.","ref":"Philippians 4:19"},{"n":70,"text":"Nothing can separate us from the love of God in Christ.","ref":"Romans 8:38-39"},{"n":71,"text":"The word of the Lord remains forever.","ref":"Isaiah 40:8; 1 Peter 1:25"},{"n":72,"text":"Faith comes from hearing the word of Christ.","ref":"Romans 10:17"},{"n":73,"text":"The joy of the Lord is your strength.","ref":"Nehemiah 8:10"},{"n":74,"text":"In everything give thanks, for this is God's will.","ref":"1 Thessalonians 5:18"},{"n":75,"text":"God opposes the proud but gives grace to the humble.","ref":"James 4:6"},{"n":76,"text":"Seek first the kingdom of God and His righteousness.","ref":"Matthew 6:33"},{"n":77,"text":"Blessed are the pure in heart, for they shall see God.","ref":"Matthew 5:8"},{"n":78,"text":"The truth will set you free.","ref":"John 8:32"},{"n":79,"text":"Do justly, love mercy, and walk humbly with God.","ref":"Micah 6:8"},{"n":80,"text":"Endurance produces character, and character produces hope.","ref":"Romans 5:3-4"},{"n":81,"text":"We are more than conquerors through Him who loved us.","ref":"Romans 8:37"},{"n":82,"text":"Present your bodies as a living sacrifice.","ref":"Romans 12:1"},{"n":83,"text":"The Lord disciplines those He loves.","ref":"Hebrews 12:6"},{"n":84,"text":"Lay up treasures in heaven.","ref":"Matthew 6:19-21"},{"n":85,"text":"The peace of God guards hearts and minds.","ref":"Philippians 4:7"},{"n":86,"text":"We have been crucified with Christ; Christ lives in us.","ref":"Galatians 2:20"},{"n":87,"text":"God works in us to will and to work for His good pleasure.","ref":"Philippians 2:13"},{"n":88,"text":"Our citizenship is in heaven.","ref":"Philippians 3:20"},{"n":89,"text":"The Lord is near to the brokenhearted.","ref":"Psalm 34:18"},{"n":90,"text":"He who began a good work will complete it.","ref":"Philippians 1:6"},{"n":91,"text":"Blessed are those who hunger and thirst for righteousness.","ref":"Matthew 5:6"},{"n":92,"text":"Forgive others as God forgave you.","ref":"Ephesians 4:32; Colossians 3:13"},{"n":93,"text":"The greatest is love.","ref":"1 Corinthians 13:13"},{"n":94,"text":"Wisdom from above is pure, peaceable, and gentle.","ref":"James 3:17"},{"n":95,"text":"The eyes of the Lord are on the righteous.","ref":"1 Peter 3:12"},{"n":96,"text":"Delight yourself in the Lord; He will give you desires of your heart.","ref":"Psalm 37:4"},{"n":97,"text":"Train up a child in the way he should go.","ref":"Proverbs 22:6"},{"n":98,"text":"The steadfast love of the Lord never ceases.","ref":"Lamentations 3:22-23"},{"n":99,"text":"We will see Him as He is and be like Him.","ref":"1 John 3:2"},{"n":100,"text":"To live is Christ, and to die is gain.","ref":"Philippians 1:21"},{"n":101,"text":"God is compassionate and will not forget the cry of the afflicted.","ref":"Psalm 9:12"},{"n":102,"text":"The Lord is slow to anger and great in power.","ref":"Nahum 1:3"},{"n":103,"text":"God’s kindness leads us to repentance.","ref":"Romans 2:4"},{"n":104,"text":"The Lord searches the heart and tests the mind.","ref":"Jeremiah 17:10"},{"n":105,"text":"God gives good gifts to those who ask Him.","ref":"Matthew 7:11"},{"n":106,"text":"The Lord is a refuge for the oppressed.","ref":"Psalm 9:9"},{"n":107,"text":"God’s steadfast love endures forever.","ref":"Psalm 136:1"},{"n":108,"text":"The Lord executes justice for the fatherless and widow.","ref":"Deuteronomy 10:18"},{"n":109,"text":"God is light, and in Him is no darkness at all.","ref":"1 John 1:5"},{"n":110,"text":"The Lord knows the days of the blameless.","ref":"Psalm 37:18"},{"n":111,"text":"Jesus is the same yesterday, today, and forever.","ref":"Hebrews 13:8"},{"n":112,"text":"Jesus is the author and perfecter of our faith.","ref":"Hebrews 12:2"},{"n":113,"text": /* ---------- DOM ---------- */
const app   = document.getElementById('app');
const numEl = document.getElementById('num');
const textEl= document.getElementById('text');
const refEl = document.getElementById('ref');
const revealBtn = document.getElementById('reveal');
const againBtn  = document.getElementById('again');
const muteBtn   = document.getElementById('mute');
const treasury  = document.getElementById('treasury');

/* ---------- floating motes ---------- */
(function makeMotes(){
  const wrap = document.getElementById('motes');
  for(let i=0;i<34;i++){
    const m = document.createElement('span');
    m.className = 'mote';
    const s = 3 + Math.random()*7;
    m.style.left = (Math.random()*100) + 'vw';
    m.style.width = s + 'px';
    m.style.height = s + 'px';
    m.style.opacity = (0.3 + Math.random()*0.6).toFixed(2);
    m.style.animationDuration = (10 + Math.random()*16) + 's';
    m.style.animationDelay = (-Math.random()*20) + 's';
    m.style.setProperty('--drift', (Math.random()*120-60)+'px');
    wrap.appendChild(m);
  }
})();

/* ---------- truth selection (shuffled bag, no repeats until exhausted) ---------- */
let bag = [];
let seen = new Set();
function refill(){
  bag = TRUTHS.map((_,i)=>i);
  for(let i=bag.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [bag[i],bag[j]]=[bag[j],bag[i]]; }
}
function pickTruth(){
  if(bag.length===0) refill();
  const t = TRUTHS[bag.pop()];
  seen.add(t.n);
  return t;
}

/* ================= AUDIO ENGINE (procedural, fully embedded) ================= */
let actx=null, master=null, reverb=null, ambientGain=null, started=false, muted=false;

function fade(param,to,sec){
  const t=actx.currentTime;
  param.cancelScheduledValues(t);
  param.setValueAtTime(param.value,t);
  param.linearRampToValueAtTime(to,t+sec);
}
function noiseBuffer(dur){
  const len=Math.floor(actx.sampleRate*dur);
  const b=actx.createBuffer(1,len,actx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return b;
}
function makeIR(dur,decay){
  const len=Math.floor(actx.sampleRate*dur);
  const b=actx.createBuffer(2,len,actx.sampleRate);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return b;
}

function initAudio(){
  if(started) return;
  started=true;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();

  master = actx.createGain();
  master.gain.value = 0.0001;
  master.connect(actx.destination);

  reverb = actx.createConvolver();
  reverb.buffer = makeIR(3.6, 2.2);
  const revGain = actx.createGain();
  revGain.gain.value = 0.85;
  reverb.connect(revGain);
  revGain.connect(master);

  startAmbient();
  if(!muted) fade(master.gain, 0.9, 4);
}

function startAmbient(){
  // A gentle, sustained A-major-ish chord, softly breathing.
  const freqs=[110.00,164.81,220.00,277.18,329.63];
  const fil=actx.createBiquadFilter();
  fil.type='lowpass'; fil.frequency.value=950; fil.Q.value=0.6;

  ambientGain=actx.createGain(); ambientGain.gain.value=0.0;
  fil.connect(ambientGain);
  ambientGain.connect(master);   // dry
  ambientGain.connect(reverb);   // wet

  freqs.forEach((f,i)=>{
    const o=actx.createOscillator();
    o.type = (i%2)? 'sine':'triangle';
    o.frequency.value=f;
    o.detune.value=(Math.random()*8-4);
    const g=actx.createGain(); g.gain.value=0.05;
    o.connect(g); g.connect(fil); o.start();
    // slow amplitude shimmer
    const lfo=actx.createOscillator(); lfo.frequency.value=0.04+Math.random()*0.06;
    const la=actx.createGain(); la.gain.value=0.028;
    lfo.connect(la); la.connect(g.gain); lfo.start();
  });

  // slow filter sweep so the pad gently opens and closes
  const flfo=actx.createOscillator(); flfo.frequency.value=0.025;
  const fa=actx.createGain(); fa.gain.value=320;
  flfo.connect(fa); fa.connect(fil.frequency); flfo.start();

  fade(ambientGain.gain, 0.5, 5);
}

// a soft bell tone (additive partials with long decay)
function bell(freq,t0,dur,vol){
  const partials=[[1,1],[2.0,0.45],[2.76,0.3],[3.95,0.18],[5.4,0.1]];
  partials.forEach(([m,a])=>{
    const o=actx.createOscillator(); o.type='sine'; o.frequency.value=freq*m;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol*a,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); g.connect(reverb);
    o.start(t0); o.stop(t0+dur+0.1);
  });
}

// rising swell during the build-up
function buildupSound(){
  if(!actx) return;
  const t0=actx.currentTime, dur=2.55;

  const src=actx.createBufferSource(); src.buffer=noiseBuffer(dur+0.4);
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=3.5;
  bp.frequency.setValueAtTime(280,t0);
  bp.frequency.exponentialRampToValueAtTime(3200,t0+dur);
  const ng=actx.createGain();
  ng.gain.setValueAtTime(0.0001,t0);
  ng.gain.exponentialRampToValueAtTime(0.16,t0+dur);
  ng.gain.exponentialRampToValueAtTime(0.0001,t0+dur+0.35);
  src.connect(bp); bp.connect(ng); ng.connect(master); ng.connect(reverb);
  src.start(t0); src.stop(t0+dur+0.5);

  // rising shimmer pad
  const o=actx.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(220,t0);
  o.frequency.exponentialRampToValueAtTime(660,t0+dur);
  const og=actx.createGain();
  og.gain.setValueAtTime(0.0001,t0);
  og.gain.exponentialRampToValueAtTime(0.07,t0+dur);
  og.gain.exponentialRampToValueAtTime(0.0001,t0+dur+0.45);
  o.connect(og); og.connect(master); og.connect(reverb);
  o.start(t0); o.stop(t0+dur+0.6);
}

// gentle ascending arpeggio at the moment of reveal
function revealChime(){
  if(!actx) return;
  const t=actx.currentTime;
  const notes=[440.00,554.37,659.25,880.00]; // A C# E A
  notes.forEach((f,i)=> bell(f, t + i*0.17, 3.4, 0.15));
}

/* ---------- mute ---------- */
function applyMute(){
  muteBtn.classList.toggle('off', muted);
  muteBtn.innerHTML = muted ? '&#128263;' : '&#9834;';
  if(actx && master) fade(master.gain, muted?0.0001:0.9, 1.2);
}
muteBtn.addEventListener('click', ()=>{ muted=!muted; applyMute(); });

/* ================= REVEAL FLOW ================= */
let busy=false, tA=null, tB=null;

function reveal(){
  if(busy) return;
  busy=true;
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();

  const t=pickTruth();
  numEl.textContent = t.n;
  textEl.textContent = t.text;
  refEl.textContent = '— ' + t.ref;

  app.classList.remove('state-idle','state-revealed');
  // force reflow so re-revealing restarts the sweep animation
  void app.offsetWidth;
  app.classList.add('state-revealing');
  treasury.style.opacity = '0';

  buildupSound();

  clearTimeout(tA); clearTimeout(tB);
  tA=setTimeout(revealChime, 2350);
  tB=setTimeout(()=>{
    app.classList.remove('state-revealing');
    app.classList.add('state-revealed');
    treasury.textContent = seen.size + ' of 300 truths beheld';
    treasury.style.opacity = '0.9';
    busy=false;
  }, 2750);
}

revealBtn.addEventListener('click', reveal);
againBtn.addEventListener('click', reveal);

// allow space / enter to reveal
window.addEventListener('keydown', e=>{
  if((e.code==='Space'||e.code==='Enter') && !busy){ e.preventDefault(); reveal(); }
});
</script>
